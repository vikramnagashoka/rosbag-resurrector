[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosbag-resurrector"
version = "0.8.5"
description = "Stop letting your rosbag data rot. A pandas-like analysis tool for robotics bag files — no ROS install required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "RosBag Resurrector Contributors"},
]
keywords = [
    "ros", "ros2", "rosbag", "mcap", "robotics", "data-analysis",
    "polars", "pandas", "plotjuggler", "machine-learning", "rlds", "lerobot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "mcap>=1.1.0",
    "mcap-ros2-support>=0.5.0",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckdb>=0.10.0",
    # No [all] extra: typer removed it in 0.12.0, when rich + shellingham
    # became default dependencies (0.11.1 is the last release that has it).
    # 0.16.0 is the first release whose --help works with click 8.2+.
    "typer>=0.16.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "plotly>=5.18.0",
    "h5py>=3.10.0",
    "pyarrow>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/vikramnagashoka/rosbag-resurrector"
Documentation = "https://github.com/vikramnagashoka/rosbag-resurrector#readme"
Repository = "https://github.com/vikramnagashoka/rosbag-resurrector"
Issues = "https://github.com/vikramnagashoka/rosbag-resurrector/issues"
Changelog = "https://github.com/vikramnagashoka/rosbag-resurrector/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ros1 = ["rosbags>=0.9.0"]
# RLDS writes TFRecords with tensorflow, so the extra installs it wherever
# tensorflow publishes a stable wheel: 2.18+ (2.21 ships cp310-cp313) on
# Linux x86_64/aarch64, Apple-silicon macOS and Windows x64, and 2.16 on
# Intel macOS (cp310-cp312; its last Intel release, which pins numpy<2).
# Elsewhere (Python 3.14, Linux ppc64le, Windows ARM64, ...) the markers
# skip tensorflow, the extra installs zarr only, and RLDS reports why it's
# unavailable. That keeps the extra resolvable on glibc Linux, macOS and
# Windows; markers can't tell musl from glibc, so on musl Linux (Alpine)
# pip finds no tensorflow wheel and the install fails.
# Keep these markers in sync with TENSORFLOW_PLATFORMS in
# resurrector/core/export.py (a test checks). The writer needs tensorflow
# only (tf.io / tf.train), so tensorflow-datasets stays out of the extra.
all-exports = [
    "zarr>=2.16.0",
    "tensorflow>=2.18; python_version < '3.14' and ((platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Windows' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')))",
    "tensorflow>=2.16,<2.17; python_version < '3.13' and platform_system == 'Darwin' and platform_machine == 'x86_64'",
]
vision-lite = ["Pillow>=10.0.0", "opencv-python-headless>=4.8.0"]
vision = ["Pillow>=10.0.0", "opencv-python-headless>=4.8.0", "sentence-transformers>=2.2.0"]
vision-openai = ["Pillow>=10.0.0", "opencv-python-headless>=4.8.0", "openai>=1.0.0"]
bridge-live = ["rclpy"]
publish = ["huggingface_hub>=0.20.0"]
copilot = ["anthropic>=0.40.0"]
# LeRobot itself requires Python 3.12+; on older interpreters the extra
# installs nothing and the exporter raises an ImportError with this hint.
lerobot = ["lerobot[dataset]>=0.6; python_version >= '3.12'", "Pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "Pillow>=10.0.0", "websockets>=12.0", "psutil>=5.9.0"]
packaging = ["pyinstaller>=6.0.0", "pyarmor>=8.0.0"]
watch = ["watchdog>=4.0.0"]

[project.scripts]
resurrector = "resurrector.cli.main:app"

[tool.setuptools.packages.find]
include = ["resurrector*"]

# Ship non-Python assets in the wheel: the React dashboard bundle and
# the bridge's standalone HTML/JS viewer. Without this glob the wheel
# installs the Python source but loading the dashboard 404s on `/`.
[tool.setuptools.package-data]
"resurrector.dashboard.static" = ["**/*"]
"resurrector.bridge.web" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Exclude `slow` from the default pytest run so PRs stay fast.
# Run them via `pytest -m slow` (CI's wheel-smoke job does this).
addopts = "-m 'not slow'"
markers = [
    "smoke: end-to-end smoke tests intended for the wheel-install CI job",
    "slow: opt-in slow tests (memory regression, large synthetic bags); run with `pytest -m slow`",
]
