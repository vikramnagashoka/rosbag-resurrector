<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RosBag Resurrector</title>
    <!-- Notebook UI (v0.8) fonts: Geist (UI) + JetBrains Mono (data/code).
         Scoped to the .nb workspace via src/styles/notebook.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hard reset — token-driven body styles live in src/styles/tokens.css */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Pre-mount fallback so the page isn't a flash of white before
       * tokens.css loads via the JS bundle. Values mirror :root from
       * tokens.css. */
      html { background: #0a0d12; color: #ecf2f8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
