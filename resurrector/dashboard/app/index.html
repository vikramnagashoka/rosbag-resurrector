<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RosBag Resurrector</title>
    <style>
      /* Hard reset — token-driven body styles live in src/styles/tokens.css */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Pre-mount fallback so the page isn't a flash of white before
       * tokens.css loads via the JS bundle. Values mirror :root from
       * tokens.css. */
      html { background: #0a0d12; color: #ecf2f8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
